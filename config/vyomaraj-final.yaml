system:
  id: VYOMARAJ-AI-STUDIO
  version: FINAL-1.0
  role: CENTRAL AI ORCHESTRATOR + AUTONOMOUS RESILIENCE CORE
  public_control_plane: false
  provider_neutral: true
  single_shared_core: true

clients:
  web:
    enabled: true
    backend: shared_api
  android:
    enabled: true
    backend: shared_api
  macos:
    enabled: true
    backend: shared_api

core:
  vyomaraj: true
  shriyantra:
    rag: true
    cag: true
    mag: true
    llm: true
    harness: true
  jarvis:
    enabled: true
    role: workflow_orchestration

providers:
  arena:
    role: orchestration/provider-adapter
  openai:
    enabled: true
  anthropic:
    enabled: true
  gemini:
    enabled: true
  local:
    enabled: true
  open_source:
    enabled: true
  future_providers:
    enabled: true

resilience:
  provider_fallback: true
  data_replication: required
  backup_verification: required
  restore_testing: required
  failover_testing: required
  failback_testing: required
  read_after_write_verification: required
  force_push: false
  blind_overwrite: false

final_authentication:
  voice: pending
  biometric: pending
  owner_passcode: pending
