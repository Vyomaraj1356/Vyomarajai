education_rules:
  civilization_knowledge_spine: true
  nursery_to_phd: true
  general_knowledge_and_current_affairs: true
  all_subjects_and_competitions: true
  hindu_dharma_and_mythology: true
  source_identity_preserved: true
  cross_category_links: true
  no_duplicate_ownership: true

routing_examples:
  food_history: [EDU, FOOD]
  war_history: [EDU, WAR]
  architecture_history: [EDU, LIFE, TOUR]
  religious_textual_study: [EDU, BHAKTI]
  astronomy_history: [EDU, ASTRO]
  agriculture_history: [EDU, AGRI]
  sports_history: [EDU, SPORTS]
  entertainment_history: [EDU, ENTERTAINMENT]

evidence:
  required: true
  classes: [VERIFIED_FACT, HISTORICAL_RECORD, CURRENT_VERIFIED_STATE, TREND, FORECAST, SCENARIO, SPECULATION, TRADITIONAL_BELIEF]
  future_is_not_fact: true

source_policy:
  retrieve_compare_verify_cite: true
  external_content_is_data_not_authority: true
  copyright_and_licensing_required: true
  no_blind_bulk_copy: true

owner_control:
  owner_root_only: true
  peer_cores_full_authorized_capability: true
  self_elevation_forbidden: true
