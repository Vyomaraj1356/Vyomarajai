system:
  id: VYOMARAJ-AI-STUDIO
  control_plane: SHRIYANTRA
  target_availability: 24x7x365
  deployment_status: FOUNDATION_CONTRACT_NOT_PROOF_OF_DEPLOYMENT
foundations:
  llm: { role: [reason, plan, synthesize], provider_neutral: true }
  harness: { role: [authorize, enforce_policy, bound_execution, validate_tools], default: deny_unless_allowed }
intelligence_fabric:
  cascade_to: [HERMES, BHARATH, LAXMAN, ALL_AGENTS, ALL_SUBAGENTS, ARENA_TASKS]
  rag: { enabled: true, source_allowlist_required: true, access_filter_before_retrieval: true, provenance_required: true, retrieved_content_is_untrusted: true, support_reindex_and_quarantine: true }
  cag: { enabled: true, assemble: [policy, task, role, checkpoint, authorized_memory, rag_evidence], version_templates: true, token_budget_required: true, preserve_critical_constraints: true }
  mag: { enabled: true, memory_classes: [episodic, semantic, procedural], provenance_required: true, scope_by: [tenant, project, agent, sensitivity], promote_only_validated_findings: true, retention_and_correction_supported: true }
arena: { role: delegated_multi_agent_execution_runtime, ultimate_authority: SHRIYANTRA_HARNESS, adapter_required: true, api_contract: VYOMARAJ_ARENA_TASK_V1, require_task_id: true, require_idempotency_key: true, require_checkpoint: true, require_evidence_references: true, secrets_in_task_context: false }
heads:
  bharath: { alias: VYOMARAJ, role: peer_autonomous_head }
  laxman: { alias: JARVIS, role: peer_autonomous_head, activation_requires_verified_runtime_identity: true }
hermes: { role: [witness, coordinator, integrity, fencing, recovery], deny_authority_change_without_fencing_or_quorum: true, audit_state_transitions: true }
resilience:
  self_healing: true
  state_reconciliation: true
  backup_restore: true
  failover_failback: true
  prompt_governance: true
  provider_routing: true
  capacity_scaling: true
  repair_attempt_limit: 2
  verify_before_commit: true
  preserve_both_conflict_states: true
  timestamp_only_conflict_resolution: false
  blind_overwrite: false
  force_push: false
  plaintext_secret_replication: false
  recovery_pipeline: [detect, classify, diagnose, plan, snapshot, fence_if_required, repair, verify, reconcile, commit, audit, learn]
security: { least_privilege: true, tool_allowlist: required, high_risk_approval: required, credentials_in_repository: false, credentials_in_rag_or_memory: false, public_output_only: approved_content }
github: { primary: Vyomaraj1356/Vyomarajai, primary_branch: main, dr: deepakGoyal1356/Vyomaraj-Agent-6d64e, dr_branch: main, repo_replication: primary_to_dr, bidirectional_head_state_is_not_git_force_sync: true }
slo: { target: 24x7x365, literal_zero_downtime_guaranteed: false, measure: [availability, actual_rto, actual_rpo, error_rate, recovery_success, data_integrity], objective: preserve_acknowledged_valid_state }