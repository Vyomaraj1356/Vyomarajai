name: ShriYantra owner guard tests

on:
  pull_request:
    paths:
      - "ops/shriyantra/**"
      - "tests/test_owner_guard.py"
      - ".github/workflows/shriyantra-owner-guard.yml"
  push:
    branches: ["main"]
    paths:
      - "ops/shriyantra/**"
      - "tests/test_owner_guard.py"
      - ".github/workflows/shriyantra-owner-guard.yml"

permissions:
  contents: read

jobs:
  owner-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependency
        run: python -m pip install -r ops/shriyantra/requirements.txt
      - name: Compile scripts
        run: python -m compileall -q ops/shriyantra tests
      - name: Run owner authorization tests
        run: python -m unittest discover -s tests -p "test_owner_guard.py" -v
