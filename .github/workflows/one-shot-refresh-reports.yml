name: One-shot generated report refresh (PR 71 only)

on:
  push:
    branches:
      - fix/trustmode-main-push-dr-sync
    paths:
      - '.github/workflows/one-shot-refresh-reports.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-refresh-reports-pr71
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/trustmode-main-push-dr-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trustmode-main-push-dr-sync
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate reports from checked-in source evidence
        run: |
          python3 ops/vyomaraj-core/handover/build_dr_sync_report.py
          python3 ops/vyomaraj-core/handover/build_configuration_report.py
      - name: Commit only regenerated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/vyomaraj-core/handover/DR_SYNC_RESULTS_2026_10_04.md ops/vyomaraj-core/handover/BUILD_AND_CONFIGURATION_2026_10_04.md
          if git diff --cached --quiet; then
            echo "Generated reports already current."
            exit 0
          fi
          git commit -m "chore(handover): refresh generated evidence reports"
          git push origin HEAD:fix/trustmode-main-push-dr-sync
