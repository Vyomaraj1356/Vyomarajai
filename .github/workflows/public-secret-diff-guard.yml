name: Public Secret Diff Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  public-secret-diff-guard:
    name: Scan added diff lines without printing values
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR code for offline guard tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the redacted scanner
        run: python -m unittest discover -s tests -p 'test_public_secret_diff_guard.py' -v

      - name: Scan newly added PR diff lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/public_secret_diff_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
