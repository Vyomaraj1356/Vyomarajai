name: Public Preview Smoke Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-preview-smoke.yml'
      - 'scripts/public_preview_smoke.py'
      - 'tests/test_public_preview_smoke.py'
      - 'ops/vyomaraj-core/experience/public_landing_server.py'
      - 'ops/vyomaraj-core/experience/**'
      - 'ops/vyomaraj-core/bhakti-experience/**'
      - 'ops/vyomaraj-core/liquor-bar/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-preview-smoke.yml'
      - 'scripts/public_preview_smoke.py'
      - 'tests/test_public_preview_smoke.py'
      - 'ops/vyomaraj-core/experience/public_landing_server.py'
      - 'ops/vyomaraj-core/experience/**'
      - 'ops/vyomaraj-core/bhakti-experience/**'
      - 'ops/vyomaraj-core/liquor-bar/**'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: public-preview-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Allow the free Render instance to wake, then run the full route checks.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test retry and smoke behavior without network access
        run: python3 -m unittest discover -s tests -p 'test_public_preview_smoke.py'
      - name: Check live public preview routes (read-only)
        env:
          BASE_URL: https://vyomaraj-public-preview.onrender.com
        run: python3 scripts/public_preview_smoke.py
