name: Public Preview Security Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-preview-security-gate.yml'
      - 'scripts/public_preview_security_smoke.py'
      - 'tests/test_public_preview_security_smoke.py'
      - 'ops/vyomaraj-core/experience/public_landing_server.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-preview-security-gate.yml'
      - 'scripts/public_preview_security_smoke.py'
      - 'tests/test_public_preview_security_smoke.py'
      - 'ops/vyomaraj-core/experience/public_landing_server.py'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: public-preview-security-gate
  cancel-in-progress: false

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test security smoke retry and route assertions without network
        run: python3 -m unittest discover -s tests -p 'test_public_preview_security_smoke.py'
      - name: Verify live public preview security headers and rejected methods (no credentials)
        env:
          BASE_URL: https://vyomaraj-public-preview.onrender.com
        run: python3 scripts/public_preview_security_smoke.py
