name: "Vyomaraj Scoped PRIMARY + SECONDARY Branch Sync"
# Non-forced Git ref replication with exact SHA read-after-write verification.

on:
  push:
    branches: [main, arena/*, feat/**, fix/**, chore/**]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 * * * *'
  repository_dispatch:
    types: [dr-sync]

permissions:
  contents: write
  actions: write

concurrency:
  group: vyomaraj-dr-sync-v15-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dr-sync-bidirectional:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || startsWith(github.ref, 'refs/heads/feat/') || github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V15.1 full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Vyomaraj DR Bot V15.1
        run: |
          git config user.name "Vyomaraj DR Bot V15.1 Always Active"
          git config user.email "vyomaraj-dr@vyomaraj.network"
          git config --global --add safe.directory $GITHUB_WORKSPACE
          echo "V15.1 ?v=151 678 LIVE 694 total KNOWLEDGE_VS_ENTERTAINMENT VYOMARAJ_JARVIS_TALK SHIV_KE_SATHI detailed"

      - name: Authenticate and select working DR credential
        env:
          VYOMARAJ_PAT: ${{ secrets.VYOMARAJ_PAT }}
          DR_SECONDARY_TOKEN: ${{ secrets.DR_SECONDARY_TOKEN }}
        run: |
          set -Eeuo pipefail
          DR_REPO="deepakGoyal1356/Vyomaraj-Agent-6d64e"
          PRIMARY_REPO="Vyomaraj1356/Vyomarajai"
          echo "Testing credentials against the private DR repository."
          echo "Primary: $PRIMARY_REPO"
          echo "Secondary: $DR_REPO"

          test_token() {
            local label="$1"
            local token="$2"
            if [ -z "$token" ]; then
              echo "ℹ️ $label is not configured."
              return 2
            fi
            echo "::add-mask::$token"
            http_code="$(curl -sS -o /tmp/dr-auth.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$DR_REPO")"
            case "$http_code" in
              200)
                echo "✅ $label can access $DR_REPO."
                printf "DR_AUTH_TOKEN=%s\n" "$token" >> "$GITHUB_ENV"
                printf "DR_REPO=%s\n" "$DR_REPO" >> "$GITHUB_ENV"
                printf "PRIMARY_REPO=%s\n" "$PRIMARY_REPO" >> "$GITHUB_ENV"
                echo "DR_PENDING=false" >> "$GITHUB_ENV"
                return 0
                ;;
              401) echo "❌ $label rejected by GitHub (HTTP 401: invalid/revoked token)." ;;
              403) echo "❌ $label reached GitHub but is forbidden (HTTP 403: permission/policy issue)." ;;
              404) echo "❌ $label cannot access $DR_REPO (HTTP 404: repository access/authorization issue)." ;;
              *) echo "❌ $label returned HTTP $http_code while accessing the DR repository." ;;
            esac
            return 1
          }

          if test_token "VYOMARAJ_PAT" "$VYOMARAJ_PAT"; then exit 0; fi
          if test_token "DR_SECONDARY_TOKEN" "$DR_SECONDARY_TOKEN"; then exit 0; fi
          echo "❌ No configured credential can access the private DR repository."
          echo "DR_PENDING=true" >> "$GITHUB_ENV"
          exit 1
      - name: Verify PRIMARY and push exact commit to SECONDARY
        if: env.DR_PENDING == 'false'
        env:
          DR_AUTH_TOKEN: ${{ env.DR_AUTH_TOKEN }}
        run: |
          set -Eeuo pipefail
          source "$GITHUB_ENV" || true
          DR_REPO="${DR_REPO:-deepakGoyal1356/Vyomaraj-Agent-6d64e}"
          PRIMARY_REPO="${PRIMARY_REPO:-Vyomaraj1356/Vyomarajai}"
          CUR_BRANCH="${GITHUB_REF#refs/heads/}"
          EXPECTED_SHA="$(git rev-parse HEAD)"

          if [ -z "${DR_AUTH_TOKEN:-}" ]; then
            echo "::error title=DR credential missing::The credential-selection step did not provide a token."
            exit 1
          fi

          echo "Scoped replication: $CUR_BRANCH only; using a non-forced Git push."
          if ! PRIMARY_SHA="$(git ls-remote origin "refs/heads/${CUR_BRANCH}" | awk 'NR == 1 {print $1}')"; then
            echo "::error title=PRIMARY ref lookup failed::Could not read the PRIMARY branch ref."
            exit 1
          fi
          if [ "$PRIMARY_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=PRIMARY SHA mismatch::Expected $EXPECTED_SHA, got ${PRIMARY_SHA:-missing}."
            exit 1
          fi
          echo "PRIMARY_REF=$PRIMARY_REPO:$CUR_BRANCH"
          echo "PRIMARY_SHA=$PRIMARY_SHA"

          # Keep credentials out of the remote URL and replace checkout's generic
          # GITHUB_TOKEN header only for this step; restore it on every exit path.
          echo "::add-mask::$DR_AUTH_TOKEN"
          DR_URL="https://github.com/${DR_REPO}.git"
          git remote remove dr >/dev/null 2>&1 || true
          git remote add dr "$DR_URL"

          CHECKOUT_AUTH_HEADERS="$(git config --local --get-all http.https://github.com/.extraheader || true)"
          restore_checkout_auth() {
            git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
            if [ -n "$CHECKOUT_AUTH_HEADERS" ]; then
              while IFS= read -r header; do
                git config --local --add http.https://github.com/.extraheader "$header"
              done <<< "$CHECKOUT_AUTH_HEADERS"
            fi
          }
          trap restore_checkout_auth EXIT
          git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
          export GIT_TERMINAL_PROMPT=0

          # PAT-backed Git HTTPS can use different accepted username conventions.
          # Try the DR owner first, the PRIMARY owner second, then GitHub's app-style
          # x-access-token name; credentials are never printed or embedded in a URL.
          DR_REPO_OWNER="${DR_REPO%%/*}"
          PRIMARY_REPO_OWNER="${PRIMARY_REPO%%/*}"
          AUTH_CANDIDATES=("$DR_REPO_OWNER")
          if [ "$PRIMARY_REPO_OWNER" != "$DR_REPO_OWNER" ]; then
            AUTH_CANDIDATES+=("$PRIMARY_REPO_OWNER")
          fi
          AUTH_CANDIDATES+=("x-access-token")
          GIT_AUTH_OK=false
          for DR_GIT_USERNAME in "${AUTH_CANDIDATES[@]}"; do
            BASIC_AUTH="$(printf '%s:%s' "$DR_GIT_USERNAME" "$DR_AUTH_TOKEN" | base64 -w0)"
            echo "::add-mask::$BASIC_AUTH"
            AUTH_HEADER="AUTHORIZATION: Basic $BASIC_AUTH"
            git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
            git config --local --add http.https://github.com/.extraheader "$AUTH_HEADER"
            if git ls-remote dr HEAD >/dev/null 2>&1; then
              GIT_AUTH_OK=true
              echo "✅ SECONDARY Git read access verified using username mode: $DR_GIT_USERNAME"
              break
            fi
          done
          if [ "$GIT_AUTH_OK" != "true" ]; then
            echo "::error title=SECONDARY Git authentication failed::The selected token passed the repository API check but could not read SECONDARY over Git HTTPS. Check token owner and repository access."
            exit 1
          fi

          if ! SECONDARY_BEFORE_SHA="$(git ls-remote dr "refs/heads/${CUR_BRANCH}" | awk 'NR == 1 {print $1}')"; then
            echo "::error title=SECONDARY ref lookup failed::Could not read the target branch before pushing."
            exit 1
          fi
          if [ -n "$SECONDARY_BEFORE_SHA" ]; then
            SECONDARY_BRANCH_EXISTS=true
          else
            SECONDARY_BRANCH_EXISTS=false
          fi
          echo "SECONDARY_BRANCH_EXISTS=$SECONDARY_BRANCH_EXISTS"

          TARGET_LOCAL_REF="refs/remotes/dr-sync-target"
          SAFE_LEGACY_MIRROR=false
          if [ "$SECONDARY_BRANCH_EXISTS" = "true" ]; then
            if ! git fetch --no-tags dr "+refs/heads/${CUR_BRANCH}:${TARGET_LOCAL_REF}"; then
              echo "::error title=SECONDARY fetch failed::Could not fetch the existing target branch for a safe ancestry check."
              exit 1
            fi
            FETCHED_TARGET_SHA="$(git rev-parse "$TARGET_LOCAL_REF")"
            if [ "$FETCHED_TARGET_SHA" != "$SECONDARY_BEFORE_SHA" ]; then
              echo "::error title=SECONDARY ref changed::The target moved during preflight; refusing to update it. Retry after the concurrent write finishes."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$FETCHED_TARGET_SHA" "$EXPECTED_SHA"; then
              # Older REST mirroring created a synthetic commit. Reconcile it only
              # when its recorded PRIMARY ancestor exists locally and its entire Git
              # tree is byte-for-byte identical. Never auto-rewrite SECONDARY main.
              if [ "$CUR_BRANCH" = "main" ] || [[ "$CUR_BRANCH" != arena/* ]]; then
                echo "::error title=SECONDARY ref diverged::Automatic history reconciliation is limited to the fixed Arena ref and is disabled for main and all other branches. No update was attempted."
                exit 1
              fi
              TARGET_SUBJECT="$(git show -s --format=%s "$TARGET_LOCAL_REF")"
              MIRRORED_SOURCE_SHA=""
              case "$TARGET_SUBJECT" in
                "chore(dr): mirror ${PRIMARY_REPO}:${CUR_BRANCH} at "*)
                  MIRRORED_SOURCE_SHA="${TARGET_SUBJECT##* at }"
                  ;;
              esac
              if [[ "$MIRRORED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${MIRRORED_SOURCE_SHA}^{commit}" 2>/dev/null; then
                if git merge-base --is-ancestor "$MIRRORED_SOURCE_SHA" "$EXPECTED_SHA"; then
                  PRIMARY_MIRROR_TREE="$(git rev-parse "${MIRRORED_SOURCE_SHA}^{tree}")"
                  SECONDARY_TREE="$(git rev-parse "${TARGET_LOCAL_REF}^{tree}")"
                  if [ "$PRIMARY_MIRROR_TREE" = "$SECONDARY_TREE" ]; then
                    SAFE_LEGACY_MIRROR=true
                  fi
                fi
              fi
              if [ "$SAFE_LEGACY_MIRROR" != "true" ]; then
                echo "::error title=SECONDARY history diverged::The private target is not a verified, unchanged API mirror of a PRIMARY ancestor. No overwrite was attempted."
                exit 1
              fi

              # Preserve the old target commit on SECONDARY before converging the
              # Arena branch. This is idempotent and uses a lease against races.
              BACKUP_BRANCH="dr-archive/${CUR_BRANCH}/pre-exact-sync-${GITHUB_RUN_ID}"
              if ! git check-ref-format "refs/heads/${BACKUP_BRANCH}" >/dev/null; then
                echo "::error title=Invalid DR archive ref::Could not construct a safe backup ref name."
                exit 1
              fi
              if ! EXISTING_BACKUP_SHA="$(git ls-remote dr "refs/heads/${BACKUP_BRANCH}" | awk 'NR == 1 {print $1}')"; then
                echo "::error title=DR archive lookup failed::Could not check the backup ref before reconciliation."
                exit 1
              fi
              if [ -z "$EXISTING_BACKUP_SHA" ]; then
                if ! git push --porcelain --no-force dr "${TARGET_LOCAL_REF}:refs/heads/${BACKUP_BRANCH}"; then
                  echo "::error title=DR archive creation failed::The old SECONDARY commit could not be preserved; the target ref was not changed."
                  exit 1
                fi
              elif [ "$EXISTING_BACKUP_SHA" != "$FETCHED_TARGET_SHA" ]; then
                echo "::error title=DR archive collision::An archive ref already exists with different content; no target update was attempted."
                exit 1
              fi
              if ! VERIFIED_BACKUP_SHA="$(git ls-remote dr "refs/heads/${BACKUP_BRANCH}" | awk 'NR == 1 {print $1}')"; then
                echo "::error title=DR archive verification failed::The SECONDARY backup ref could not be read back."
                exit 1
              fi
              if [ "$VERIFIED_BACKUP_SHA" != "$FETCHED_TARGET_SHA" ]; then
                echo "::error title=DR archive verification failed::The backup ref does not point to the original target commit; no target update was attempted."
                exit 1
              fi
              printf 'DR_ARCHIVE_REF=%s:%s\n' "$DR_REPO" "$BACKUP_BRANCH" >> "$GITHUB_ENV"
              echo "Preserved the previous synthetic mirror on SECONDARY ref $BACKUP_BRANCH."

              PUSH_LOG="$(mktemp)"
              if ! git push --porcelain --force-with-lease="refs/heads/${CUR_BRANCH}:${SECONDARY_BEFORE_SHA}" dr "HEAD:refs/heads/${CUR_BRANCH}" >"$PUSH_LOG" 2>&1; then
                tail -n 12 "$PUSH_LOG"
                echo "::error title=SECONDARY convergence failed::The original ref is still archived at $BACKUP_BRANCH; lease-protected update was rejected."
                exit 1
              fi
              rm -f "$PUSH_LOG"
              echo "Reconciled the verified legacy mirror with a lease; the old target remains in the private archive ref."
            fi
          fi

          if [ "$SAFE_LEGACY_MIRROR" != "true" ]; then
            echo "Pushing only $CUR_BRANCH to SECONDARY $DR_REPO without force."
            PUSH_LOG="$(mktemp)"
            if ! git push --porcelain --no-force dr "HEAD:refs/heads/${CUR_BRANCH}" >"$PUSH_LOG" 2>&1; then
              tail -n 12 "$PUSH_LOG"
              if grep -Eqi 'non-fast-forward|fetch first|stale info' "$PUSH_LOG"; then
                echo "::error title=SECONDARY history diverged::A non-fast-forward update was refused; no force update was attempted."
              elif grep -Eqi '403|write access|permission|protected branch|GH006|GH013' "$PUSH_LOG"; then
                echo "::error title=SECONDARY write denied::The selected credential or branch rules do not permit this write. No force update was attempted."
              else
                echo "::error title=SECONDARY push failed::Inspect the step output. No force update was attempted."
              fi
              exit 1
            fi
            rm -f "$PUSH_LOG"
          fi

          if ! SECONDARY_SHA="$(git ls-remote dr "refs/heads/${CUR_BRANCH}" | awk 'NR == 1 {print $1}')"; then
            echo "::error title=SECONDARY ref lookup failed::The push returned success, but the SECONDARY ref could not be read back."
            exit 1
          fi
          if [ "$SECONDARY_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=SECONDARY SHA mismatch::Expected $EXPECTED_SHA, got ${SECONDARY_SHA:-missing}."
            exit 1
          fi

          echo "SECONDARY_REF=$DR_REPO:$CUR_BRANCH"
          echo "SECONDARY_SHA=$SECONDARY_SHA"
          echo "✅ Exact PRIMARY/SECONDARY SHA equality verified for $CUR_BRANCH at $EXPECTED_SHA."
          printf 'DR_SYNCED_SHA=%s\n' "$EXPECTED_SHA" >> "$GITHUB_ENV"
          printf 'DR_SECONDARY_SHA=%s\n' "$SECONDARY_SHA" >> "$GITHUB_ENV"
      - name: DR to PRIMARY controlled failover audit (read-only)
        if: env.DR_PENDING == 'false' && github.ref == 'refs/heads/main'
        env:
          DR_AUTH_TOKEN: ${{ secrets.VYOMARAJ_PAT || secrets.DR_SECONDARY_TOKEN }}
        run: |
          set -Eeuo pipefail
          source "$GITHUB_ENV" || true
          DR_REPO="${DR_REPO:-deepakGoyal1356/Vyomaraj-Agent-6d64e}"
          echo "Read-only DR→PRIMARY audit; automatic promotion and force updates are disabled."
          DR_MAIN_SHA="$(curl -sS --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DR_AUTH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DR_REPO/git/ref/heads/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          PRIMARY_MAIN_SHA="$(git rev-parse HEAD)"
          echo "PRIMARY_MAIN_SHA=$PRIMARY_MAIN_SHA"
          echo "SECONDARY_MAIN_SHA=$DR_MAIN_SHA"
          if [ "$PRIMARY_MAIN_SHA" = "$DR_MAIN_SHA" ]; then
            echo "✅ PRIMARY and SECONDARY main point to the same SHA."
          else
            echo "⚠️ PRIMARY and SECONDARY main differ."
            echo "No automatic DR→PRIMARY promotion was attempted; use a reviewed recovery procedure."
          fi

      - name: Heartbeat plus PRIMARY SECONDARY read-only health check
        run: |
          set -Eeuo pipefail
          source "$GITHUB_ENV" || true
          PRIMARY_REPO="${PRIMARY_REPO:-Vyomaraj1356/Vyomarajai}"
          DR_REPO="${DR_REPO:-deepakGoyal1356/Vyomaraj-Agent-6d64e}"
          echo "Read-only PRIMARY/SECONDARY health check at $(date -u)."

          if git ls-remote "https://github.com/${PRIMARY_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "✅ PRIMARY is reachable: $PRIMARY_REPO"
          else
            echo "::error title=PRIMARY unavailable::Could not read the PRIMARY repository ref."
            exit 1
          fi

          if [ -n "${DR_AUTH_TOKEN:-}" ]; then
            DR_HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $DR_AUTH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$DR_REPO")"
            if [ "$DR_HTTP_CODE" = "200" ]; then
              echo "✅ SECONDARY is reachable through the selected credential: $DR_REPO"
            else
              echo "::error title=SECONDARY unavailable::Authenticated repository check returned HTTP $DR_HTTP_CODE."
              exit 1
            fi
          else
            echo "::error title=SECONDARY credential missing::No selected credential is available for the private repository check."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST="$(git log -1 --format=%ct)"
            NOW="$(date +%s)"
            AGE=$(( NOW - LAST ))
            echo "Scheduled heartbeat age: ${AGE}s; no heartbeat commit or repository ref update is performed."
            {
              echo "### Read-only DR heartbeat"
              echo "- Checked at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "- PRIMARY ref SHA: $(git rev-parse HEAD)"
              echo "- Verified SECONDARY SHA from this run: ${DR_SYNCED_SHA:-unverified}"
              echo "- This health-check step did not commit or push to either repository."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Heartbeat check complete; no repository refs were changed by this step."
          fi

      - name: Report scoped branch targets
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Primary target: Vyomaraj1356/Vyomarajai:${GITHUB_REF_NAME}"
          echo "Secondary target: deepakGoyal1356/Vyomaraj-Agent-6d64e:${GITHUB_REF_NAME}"
          echo "Only this ref is written on SECONDARY; PRIMARY and sibling refs are not modified."
          ls -lh index.html

      - name: Report PRIMARY + SECONDARY branch sync status
        run: |
          {
            echo "### Vyomaraj scoped branch sync"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            if [ -n "${DR_SYNCED_SHA:-}" ] && [ "${DR_SYNCED_SHA}" = "${DR_SECONDARY_SHA:-}" ]; then
              echo "- Status: success — exact SHA equality was verified after a non-forced push."
              echo "- PRIMARY SHA: \`${DR_SYNCED_SHA}\`"
              echo "- SECONDARY SHA: \`${DR_SECONDARY_SHA}\`"
            else
              echo "- Status: no successful read-after-write SHA verification is recorded for this run."
            fi
            echo "- Scope: the triggering ref only; no sibling ref is written."
            if [ -n "${DR_ARCHIVE_REF:-}" ]; then
              echo "- Preserved previous SECONDARY history at: \`${DR_ARCHIVE_REF}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
