name: Vyomaraj PRIMARY to DR Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: vyomaraj-primary-to-dr-main
  cancel-in-progress: false

env:
  PRIMARY_REPO: Vyomaraj1356/Vyomarajai
  PRIMARY_BRANCH: main
  DR_REPO: deepakGoyal1356/Vyomaraj-Agent-6d64
  DR_BRANCH: main

jobs:
  dr-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIMARY
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify PRIMARY
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$PRIMARY_REPO"
          test "$GITHUB_REF_NAME" = "$PRIMARY_BRANCH"
          PRIMARY_COMMIT="$(git rev-parse HEAD)"
          REMOTE_COMMIT="$(git ls-remote origin "refs/heads/$PRIMARY_BRANCH" | awk 'NR==1 {print $1}')"
          test "$PRIMARY_COMMIT" = "$REMOTE_COMMIT"
          echo "PRIMARY_REPO=$PRIMARY_REPO"
          echo "PRIMARY_BRANCH=$PRIMARY_BRANCH"
          echo "PRIMARY_COMMIT=$PRIMARY_COMMIT"

      - name: Authenticate DR
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set -euo pipefail
          test -n "$DR_TOKEN"
          echo "::add-mask::$DR_TOKEN"
          CODE="$(curl -sS -o /tmp/dr.json -w "%{http_code}"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $DR_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$DR_REPO")"
          test "$CODE" = "200"
          echo "DR_AUTH=PASS"
          echo "DR_REPO=$DR_REPO"
          echo "DR_BRANCH=$DR_BRANCH"

      - name: Replicate PRIMARY main to DR main
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
          PRIMARY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com"
          VERSION="2022-11-28"
          PRIMARY_COMMIT="$(git rev-parse HEAD)"

          api_primary() {
            curl -sS --fail-with-body               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $PRIMARY_TOKEN"               -H "X-GitHub-Api-Version: $VERSION" "$@"
          }

          api_dr() {
            curl -sS --fail-with-body               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $DR_TOKEN"               -H "X-GitHub-Api-Version: $VERSION" "$@"
          }

          echo "::add-mask::$DR_TOKEN"

          # CORRECT OBJECT CHAIN: commit -> tree -> recursive tree.
          COMMIT_JSON="$(api_primary "$API/repos/$PRIMARY_REPO/git/commits/$PRIMARY_COMMIT")"
          PRIMARY_TREE="$(python -c 'import json,sys; print(json.load(sys.stdin)["tree"]["sha"])' <<< "$COMMIT_JSON")"
          test -n "$PRIMARY_TREE"

          api_primary "$API/repos/$PRIMARY_REPO/git/trees/$PRIMARY_TREE?recursive=1" > /tmp/primary-tree.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/primary-tree.json", encoding="utf-8"))
          if d.get("truncated"):
              raise SystemExit("PRIMARY tree is truncated; refusing partial replication.")
          print("PRIMARY_TREE_ENTRIES="+str(len(d.get("tree", []))))
          PY

          python - "$DR_REPO" "$DR_TOKEN" "$PRIMARY_TOKEN" "$VERSION" "$PRIMARY_REPO" "$PRIMARY_COMMIT" "$PRIMARY_TREE" <<'PY'
          import base64, json, sys, urllib.error, urllib.request
          from urllib.parse import quote

          dr_repo, dr_token, primary_token, version, primary_repo, primary_commit, primary_tree = sys.argv[1:]

          def request(method, url, token, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": version,
                      "User-Agent": "Vyomaraj-DR-Sync",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  detail=e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {method} {url}: {detail[:800]}")

          source=json.load(open("/tmp/primary-tree.json", encoding="utf-8"))
          entries=[e for e in source.get("tree", []) if e.get("type")=="blob"]

          # Read existing DR main. Never force-push.
          ref_url=f"https://api.github.com/repos/{dr_repo}/git/refs/heads/main"
          parent=None
          base_tree=None
          try:
              ref=request("GET", ref_url, dr_token)
              parent=ref["object"]["sha"]
              old_commit=request("GET", f"https://api.github.com/repos/{dr_repo}/git/commits/{parent}", dr_token)
              base_tree=old_commit["tree"]["sha"]
          except RuntimeError as e:
              if "HTTP 404" not in str(e):
                  raise
              print("DR main does not exist; creating initial DR commit.")

          target_entries=[]
          for i,e in enumerate(entries,1):
              blob=request(
                  "GET",
                  f"https://api.github.com/repos/{primary_repo}/git/blobs/{quote(e['sha'], safe='')}",
                  primary_token,
              )
              raw=base64.b64decode("".join(blob["content"].split()))
              created=request(
                  "POST",
                  f"https://api.github.com/repos/{dr_repo}/git/blobs",
                  dr_token,
                  {"encoding":"base64","content":base64.b64encode(raw).decode()},
              )
              target_entries.append({
                  "path":e["path"],
                  "mode":e.get("mode","100644"),
                  "type":"blob",
                  "sha":created["sha"],
              })
              if i % 50 == 0:
                  print(f"REPLICATED_BLOBS={i}/{len(entries)}")

          tree_payload={"tree":target_entries}
          if base_tree:
              tree_payload["base_tree"]=base_tree

          new_tree=request(
              "POST",
              f"https://api.github.com/repos/{dr_repo}/git/trees",
              dr_token,
              tree_payload,
          )["sha"]

          commit_payload={
              "message":f"chore(dr): mirror {primary_repo}:main at {primary_commit}",
              "tree":new_tree,
          }
          if parent:
              commit_payload["parents"]=[parent]

          new_commit=request(
              "POST",
              f"https://api.github.com/repos/{dr_repo}/git/commits",
              dr_token,
              commit_payload,
          )["sha"]

          if parent:
              request("PATCH", ref_url, dr_token, {"sha":new_commit,"force":False})
          else:
              request(
                  "POST",
                  "https://api.github.com/repos/"+dr_repo+"/git/refs",
                  dr_token,
                  {"ref":"refs/heads/main","sha":new_commit},
              )

          verified_ref=request("GET", ref_url, dr_token)["object"]["sha"]
          if verified_ref != new_commit:
              raise SystemExit(f"READ_AFTER_WRITE_REF_FAIL expected={new_commit} actual={verified_ref}")

          verified_commit=request(
              "GET",
              f"https://api.github.com/repos/{dr_repo}/git/commits/{verified_ref}",
              dr_token,
          )
          verified_tree=verified_commit["tree"]["sha"]

          print(f"PRIMARY_COMMIT_SHA={primary_commit}")
          print(f"PRIMARY_TREE_SHA={primary_tree}")
          print(f"DR_COMMIT_SHA={verified_ref}")
          print(f"DR_TREE_SHA={verified_tree}")
          print(f"DATA_MATCH={verified_tree == primary_tree}")
          print(f"READ_AFTER_WRITE=True")

          if verified_tree != primary_tree:
              raise SystemExit(
                  f"DATA_MATCH_FAIL primary_tree={primary_tree} dr_tree={verified_tree}"
              )
          print("PRIMARY_TO_DR=PASS")
          PY

      - name: DR health and integrity report
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set -euo pipefail
          API="https://api.github.com"
          VERSION="2022-11-28"
          DR_COMMIT="$(curl -sS --fail-with-body             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $DR_TOKEN"             -H "X-GitHub-Api-Version: $VERSION"             "$API/repos/$DR_REPO/git/refs/heads/$DR_BRANCH" |
            python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          echo "DR_ACTIVE_TARGET=$DR_REPO:$DR_BRANCH"
          echo "DR_REACHABLE=PASS"
          echo "DR_MAIN_COMMIT=$DR_COMMIT"
          echo "DR_SYNC_STATE=ACTIVE_WARM_MIRROR"
          echo "FAILOVER_POLICY=CONTROLLED_ONLY"
          echo "FORCE_PUSH=DISABLED"
          echo "SPLIT_BRAIN_AUTO_PROMOTION=DISABLED"
          echo "DR_TO_PRIMARY_AUTO_OVERWRITE=DISABLED"
