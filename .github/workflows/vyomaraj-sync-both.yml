name: "Vyomaraj PRIMARY to DR Sync"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyomaraj-primary-to-dr
  cancel-in-progress: false

env:
  PRIMARY_REPO: "Vyomaraj1356/Vyomarajai"
  PRIMARY_BRANCH: "main"
  DR_REPO: "deepakGoyal1356/Vyomaraj-Agent-6d64"
  DR_BRANCH: "main"

jobs:
  primary-to-dr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIMARY
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PRIMARY identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$PRIMARY_REPO"
          test "$GITHUB_REF_NAME" = "$PRIMARY_BRANCH"
          EXPECTED_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$PRIMARY_BRANCH" | awk 'NR==1 {print $1}')"
          test "$EXPECTED_SHA" = "$REMOTE_SHA"
          echo "PRIMARY=$PRIMARY_REPO:$PRIMARY_BRANCH"
          echo "PRIMARY_SHA=$EXPECTED_SHA"

      - name: Verify DR credential
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set -euo pipefail
          test -n "$DR_TOKEN"
          echo "::add-mask::$DR_TOKEN"
          code="$(curl -sS -o /tmp/dr.json -w "%{http_code}" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $DR_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$DR_REPO")"
          test "$code" = "200"
          echo "DR=$DR_REPO:$DR_BRANCH authenticated"

      - name: Replicate PRIMARY main to DR main
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
          PRIMARY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git rev-parse HEAD)"
          export EXPECTED_SHA
          export SOURCE_TREE_SHA="$(
            curl -sS --fail-with-body -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $PRIMARY_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$PRIMARY_REPO/git/commits/$EXPECTED_SHA" |
            python -c 'import json,sys; print(json.load(sys.stdin)["tree"]["sha"])'
          )"
          test -n "$SOURCE_TREE_SHA"
          export DR_TOKEN PRIMARY_TOKEN
          curl -sS --fail-with-body -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $PRIMARY_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$PRIMARY_REPO/git/trees/$SOURCE_TREE_SHA?recursive=1" > /tmp/source-tree.json

          python - <<'PY'
          import base64,json,os,urllib.error,urllib.request
          from urllib.parse import quote
          API="https://api.github.com"
          primary_repo=os.environ["PRIMARY_REPO"]; dr_repo=os.environ["DR_REPO"]
          primary_token=os.environ["PRIMARY_TOKEN"]; dr_token=os.environ["DR_TOKEN"]
          source_sha=os.environ["EXPECTED_SHA"]; source_tree=os.environ["SOURCE_TREE_SHA"]
          def req(method,url,token,body=None):
              data=None if body is None else json.dumps(body).encode()
              headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28","User-Agent":"Vyomaraj-Primary-DR"}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method=method)) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"HTTP {e.code}: {e.read().decode()[:700]}")
          source=json.load(open("/tmp/source-tree.json",encoding="utf-8"))
          if source.get("truncated"): raise SystemExit("PRIMARY tree is truncated; refusing partial replication.")
          entries=[]
          for e in source["tree"]:
              if e["type"]!="blob": continue
              blob=req("GET",f"{API}/repos/{primary_repo}/git/blobs/{quote(e['sha'],safe='')}",primary_token)
              raw=base64.b64decode("".join(blob["content"].split()))
              made=req("POST",f"{API}/repos/{dr_repo}/git/blobs",dr_token,{"encoding":"base64","content":base64.b64encode(raw).decode()})
              entries.append({"path":e["path"],"mode":e.get("mode","100644"),"type":"blob","sha":made["sha"]})
          ref=f"{API}/repos/{dr_repo}/git/refs/heads/main"; parent=None; base_tree=None
          try:
              current=req("GET",ref,dr_token); parent=current["object"]["sha"]
              base_tree=req("GET",f"{API}/repos/{dr_repo}/git/commits/{parent}",dr_token)["tree"]["sha"]
          except RuntimeError as e:
              if "HTTP 404" not in str(e): raise
          payload={"tree":entries}
          if base_tree: payload["base_tree"]=base_tree
          target_tree=req("POST",f"{API}/repos/{dr_repo}/git/trees",dr_token,payload)["sha"]
          commit={"message":f"chore(dr): mirror {primary_repo}:main at {source_sha}","tree":target_tree}
          if parent: commit["parents"]=[parent]
          new=req("POST",f"{API}/repos/{dr_repo}/git/commits",dr_token,commit)["sha"]
          if parent: req("PATCH",ref,dr_token,{"sha":new,"force":False})
          else: req("POST",f"{API}/repos/{dr_repo}/git/refs",dr_token,{"ref":"refs/heads/main","sha":new})
          verified=req("GET",ref,dr_token)["object"]["sha"]
          verified_tree=req("GET",f"{API}/repos/{dr_repo}/git/commits/{verified}",dr_token)["tree"]["sha"]
          print(f"PRIMARY_COMMIT_SHA={source_sha}")
          print(f"PRIMARY_TREE_SHA={source_tree}")
          print(f"DR_COMMIT_SHA={verified}")
          print(f"DR_TREE_SHA={verified_tree}")
          print(f"DATA_MATCH={verified_tree==source_tree}")
          print(f"READ_AFTER_WRITE={verified==new}")
          if verified_tree!=source_tree: raise SystemExit("PRIMARY to DR tree mismatch")
          if verified!=new: raise SystemExit("DR read-after-write mismatch")
          print("PRIMARY_TO_DR=PASS")
          PY

      - name: Final report
        run: |
          echo "PRIMARY: $PRIMARY_REPO:$PRIMARY_BRANCH"
          echo "DR: $DR_REPO:$DR_BRANCH"
          echo "Direction: PRIMARY -> DR only"
          echo "Arena/feature branches: NOT replicated"
          echo "DR -> PRIMARY: recovery-only, manual, integrity-gated"
