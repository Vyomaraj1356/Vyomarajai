name: Vyomaraj PRIMARY to DR Sync

on:
  push:
    # Every Arena session branch, not one hard-coded name: the offline gate and the read-only
    # PAT diagnostic must run on the branch a session actually pushes. Replication itself stays
    # main-only (see the verify-or-sync `if`).
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify is read-only; sync requires approved target and primary main'
        type: choice
        options: [verify, sync]
        default: verify
      allow_target_only_removal:
        description: 'SYNC ONLY: after reviewing/backing up secondary-only files, approve removal from its current snapshot (history retained)'
        type: boolean
        default: false
      diagnostic_target:
        description: 'Optional owner/repo for READ-ONLY diagnosis; never used for sync'
        type: string
        default: ''
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: vyomaraj-dr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auto-align coverage and completion-path gate
        run: |
          python3 ops/vyomaraj-core/handover/auto_align.py --check
          python3 ops/vyomaraj-core/handover/build_issue_ledger.py --check
      - name: Offline safety and integrity suites (no credentials)
        run: python3 ops/vyomaraj-core/handover/run_offline_suites.py --ci

  diagnose-existing-pat:
    needs: offline-tests
    # Trusted same-repository push only; never execute a fork/PR credential probe.
    if: >-
      github.repository == 'Vyomaraj1356/Vyomarajai' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only repository, ref and tree diagnostic (never replicate)
        env:
          PRIMARY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
        run: python ops/dr/actions_read_probe.py
      - name: Upload sanitized read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-read-only-diagnostic
          path: dr-read-probe.json
          if-no-files-found: ignore
          retention-days: 7

  verify-or-sync:
    needs: offline-tests
    if: >-
      github.repository == 'Vyomaraj1356/Vyomarajai' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify or replicate exact main snapshot
        env:
          PRIMARY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
          DR_REPO: ${{ vars.VYOMARAJ_DR_REPO }}
          DR_SYNC_APPROVED: ${{ vars.VYOMARAJ_DR_SYNC_ENABLED }}
          DR_ALLOW_TARGET_ONLY_REMOVAL: ${{ inputs.allow_target_only_removal }}
          REQUEST_MODE: ${{ inputs.mode }}
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        run: |
          set -euo pipefail
          # Reviewed in-repository defaults remove the need to WRITE Actions variables
          # through Arena's restricted token. Explicit repository variables still override.
          if [ -z "$DR_REPO" ]; then
            export DR_REPO="$(python -c 'import json; print(json.load(open("ops/dr/DR_POLICY.json"))["secondary"])')"
          fi
          if [ -z "$DR_SYNC_APPROVED" ]; then
            export DR_SYNC_APPROVED="$(python -c 'import json; print(str(json.load(open("ops/dr/DR_POLICY.json"))["sync_approved_on_main"]).lower())')"
          fi
          # No environment-file sourcing, token-owner guesses or response-body logging.
          if [ -z "$DR_TOKEN" ]; then
            echo '::error::VYOMARAJ_PAT is unavailable. Configure it in Actions secrets; never paste it in chat.'
            exit 1
          fi
          MODE="${REQUEST_MODE:-verify}"
          # Main pushes and the schedule are verification-only. Replication requires an
          # explicit owner/admin workflow_dispatch after confirming the effective target.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            MODE=verify
          fi
          if [ "$MODE" = sync ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$DR_SYNC_APPROVED" = true
            test -n "$DR_REPO"
            test -z "${DIAGNOSTIC_TARGET:-}"
            python ops/dr/dr_diagnostics.py --output dr-diagnostic-evidence.json
            python ops/dr/dr_sync.py --sync --output dr-evidence.json
          else
            if [ -n "${DIAGNOSTIC_TARGET:-}" ]; then export DR_REPO="$DIAGNOSTIC_TARGET"; fi
            python ops/dr/dr_diagnostics.py --output dr-diagnostic-evidence.json
            python ops/dr/dr_sync.py --output dr-evidence.json
          fi
          # Package parity runs after the tree comparison in BOTH modes, so every run states
          # whether primary and secondary hold the same dependency manifests and release
          # archives. It is read-only and never writes to the secondary. A package MISMATCH
          # or a broken declaration (exit 1) fails the job; an access/transport BLOCK
          # (exit 2) is recorded as a warning rather than being reported as parity.
          parity_rc=0
          python ops/dr/package_parity.py --remote --output dr-package-parity.json || parity_rc=$?
          if [ "$parity_rc" = "1" ]; then
            echo '::error::Primary and secondary do not carry the same packages, or a dependency declaration is inconsistent.'
            exit 1
          elif [ "$parity_rc" != "0" ]; then
            echo "::warning::Package parity could not be determined (exit $parity_rc); no parity is claimed."
          fi
      - name: Upload sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-verification-evidence
          path: |
            dr-evidence.json
            dr-diagnostic-evidence.json
            dr-package-parity.json
          if-no-files-found: ignore
          retention-days: 14
