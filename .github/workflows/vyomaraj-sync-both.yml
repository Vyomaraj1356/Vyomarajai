name: Vyomaraj PRIMARY to DR Sync

on:
  push:
    branches: [main, arena/01a10140-vyomarajai]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify is read-only; sync requires approved target and primary main'
        type: choice
        options: [verify, sync]
        default: verify
      diagnostic_target:
        description: 'Optional owner/repo for READ-ONLY diagnosis; never used for sync'
        type: string
        default: ''
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: vyomaraj-dr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline safety and integrity tests (no credentials)
        run: |
          python -m unittest discover -s ops/dr -p 'test_*.py' -v
          python ops/vyomaraj-core/handover/rebuild_handover.py --check
          python -m unittest discover -s ops/vyomaraj-core/handover -p 'test_*.py' -v
          node --test ops/vyomaraj-core/test_safe_metadata.cjs
          python -m unittest discover -s ops/vyomaraj-core/liquor-bar -p 'test_*.py' -v
          node --check ops/vyomaraj-core/liquor-bar/app.js
          python -m unittest discover -s ops/vyomaraj-core/experience -p 'test_*.py' -v
          node --check ops/vyomaraj-core/bhakti-experience/app.js
          node --check ops/vyomaraj-core/music-experience/app.js
          bash -n ops/dr/run-dr.sh ops/dr/failover-controller.sh

  verify-or-sync:
    needs: offline-tests
    if: >-
      github.repository == 'Vyomaraj1356/Vyomarajai' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify or replicate exact main snapshot
        env:
          PRIMARY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
          DR_REPO: ${{ vars.VYOMARAJ_DR_REPO }}
          DR_SYNC_APPROVED: ${{ vars.VYOMARAJ_DR_SYNC_ENABLED }}
          REQUEST_MODE: ${{ inputs.mode }}
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        run: |
          set -euo pipefail
          # No environment-file sourcing, token-owner guesses or response-body logging.
          if [ -z "$DR_TOKEN" ]; then
            echo '::error::VYOMARAJ_PAT is unavailable. Configure it in Actions secrets; never paste it in chat.'
            exit 1
          fi
          MODE="${REQUEST_MODE:-verify}"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$DR_SYNC_APPROVED" = true ]; then
            MODE=sync
          fi
          if [ "$MODE" = sync ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$DR_SYNC_APPROVED" = true
            test -n "$DR_REPO"
            test -z "${DIAGNOSTIC_TARGET:-}"
            python ops/dr/dr_sync.py --sync --output dr-evidence.json
          else
            if [ -n "${DIAGNOSTIC_TARGET:-}" ]; then export DR_REPO="$DIAGNOSTIC_TARGET"; fi
            python ops/dr/dr_sync.py --output dr-evidence.json
          fi
      - name: Upload sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-verification-evidence
          path: dr-evidence.json
          if-no-files-found: ignore
          retention-days: 14
