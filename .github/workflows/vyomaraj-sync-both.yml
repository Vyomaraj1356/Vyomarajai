name: Vyomaraj Sync — PRIMARY (Vyomaraj1356/Vyomarajai) ↔ SECONDARY (deepakGoyal1356/Vyomaraj-Agent) — Hourly BOTH (per owner)

on:
  push:
    branches: [main, arena/*, feat/**, fix/**, chore/**]
  workflow_dispatch:
  schedule:
    # Hourly sync BOTH as owner requested every 1h (plus 30m heartbeat for 0.00 loss) — corrected 2026-09-27 per owner primary=Vyomarajai
    - cron: '*/30 * * * *'
    - cron: '0 * * * *'
  # Real-time sync from DR via repository_dispatch (when DR pushes, sync back)
  repository_dispatch:
    types: [dr-sync]

permissions:
  contents: write
  actions: write

concurrency:
  group: vyomaraj-dr-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dr-sync-bidirectional:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || startsWith(github.ref, 'refs/heads/feat/') || github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Vyomaraj DR Bot
        run: |
          git config user.name "Vyomaraj DR Bot — Always Active"
          git config user.email "vyomaraj-dr@vyomaraj.network"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Detect Primary/DR and Real-time Sync — CORRECTED 2026-09-27 per owner (PRIMARY=Vyomarajai)
        env:
          VYOMARAJ_PAT: ${{ secrets.VYOMARAJ_GH_PAT }}
          # CORRECTED per owner 2026-09-27 — PRIMARY = Vyomaraj1356/Vyomarajai (Public, PRIMARY)
          # SECONDARY/DR = deepakGoyal1356/Vyomaraj-Agent (PRIVATE, SECONDARY) — always 0.00 impact, fraction-seconds sync
          # Arena syncs BOTH every hour as requested (every 1h, plus every push for real-time)
          PRIMARY_REPO: Vyomaraj1356/Vyomarajai
          DR_REPO_PRIMARY: deepakGoyal1356/Vyomaraj-Agent
          DR_REPO_FALLBACK: Vyomaraj1356/Vyomarajai
        run: |
          set -e
          echo "🔁 Vyomaraj DR Real-time Sync — Primary ↔ DR — No Data Loss"
          echo "Event: ${{ github.event_name }} Ref: ${{ github.ref_name }} SHA: ${{ github.sha }}"
          git remote -v
          echo "--- Primary/DR detection ---"
          # CORRECTED: PRIMARY is Vyomaraj1356/Vyomarajai (Public, PRIMARY) — always try Primary first
          # SECONDARY/DR is deepakGoyal1356/Vyomaraj-Agent (secondary, always synced hourly as owner requested)
          DR_REPO="deepakGoyal1356/Vyomaraj-Agent"
          DR_URL="https://github.com/${DR_REPO}.git"
          PRIMARY_TRY="Vyomaraj1356/Vyomarajai"
          echo "Trying PRIMARY (owner's primary): $PRIMARY_TRY"
          echo "Trying SECONDARY/DR: $DR_REPO"
          # Check PRIMARY exists (should be Vyomarajai)
          if git ls-remote "https://github.com/${PRIMARY_TRY}.git" >/dev/null 2>&1; then
            echo "✅ PRIMARY found: $PRIMARY_TRY"
          else
            echo "⚠️ PRIMARY $PRIMARY_TRY not reachable — check permissions"
          fi
          # For hourly sync both: we will push to BOTH repos (primary + secondary) — every 1h as requested
          if git ls-remote "https://github.com/${DR_REPO}.git" >/dev/null 2>&1; then
            echo "✅ SECONDARY found: $DR_REPO"
          else
            echo "⚠️ SECONDARY $DR_REPO not found"
          fi
          # Legacy DR_REPO env kept as SECONDARY for backward compat
          echo "DR_REPO=$DR_REPO" >> $GITHUB_ENV
          echo "DR_URL=$DR_URL" >> $GITHUB_ENV
          echo "PRIMARY_REPO=$PRIMARY_TRY" >> $GITHUB_ENV
          echo "PRIMARY_URL=https://github.com/${PRIMARY_TRY}.git" >> $GITHUB_ENV
          # Check PAT
          if [ -z "$VYOMARAJ_PAT" ]; then
            echo "⚠️ VYOMARAJ_GH_PAT not set — DR sync will be queued, not pushed yet"
            echo "👉 Owner action: Create PAT (classic, repo scope, for Vyomaraj1356) → Settings → Secrets → Actions → VYOMARAJ_GH_PAT"
            echo "   Then re-run this workflow via workflow_dispatch"
            echo "DR_PENDING=true" >> $GITHUB_ENV
          else
            echo "✅ PAT present — will push real-time"
            echo "DR_PENDING=false" >> $GITHUB_ENV
          fi
          # Also ensure origin is always up to date (primary)
          echo "Primary: $PRIMARY_REPO (origin)"

      - name: Push to PRIMARY + SECONDARY — Hourly Sync BOTH (per owner: every 1h sync both)
        if: env.DR_PENDING == 'false'
        env:
          VYOMARAJ_PAT: ${{ secrets.VYOMARAJ_GH_PAT }}
        run: |
          set -e
          source $GITHUB_ENV || true
          DR_REPO="${DR_REPO:-deepakGoyal1356/Vyomaraj-Agent}"
          PRIMARY_REPO="${PRIMARY_REPO:-Vyomaraj1356/Vyomarajai}"
          echo "📌 Pushing to BOTH as owner requested (every 1h sync both):"
          echo "   PRIMARY (Public): $PRIMARY_REPO"
          echo "   SECONDARY (Private): $DR_REPO"
          # Setup PRIMARY remote (Vyomarajai) with PAT
          if ! git remote get-url primary >/dev/null 2>&1; then
            git remote add primary "https://x-access-token:${VYOMARAJ_PAT}@github.com/${PRIMARY_REPO}.git"
          else
            git remote set-url primary "https://x-access-token:${VYOMARAJ_PAT}@github.com/${PRIMARY_REPO}.git"
          fi
          # Setup SECONDARY/DR remote (Vyomaraj-Agent) with PAT
          if ! git remote get-url dr >/dev/null 2>&1; then
            git remote add dr "https://x-access-token:${VYOMARAJ_PAT}@github.com/${DR_REPO}.git"
          else
            git remote set-url dr "https://x-access-token:${VYOMARAJ_PAT}@github.com/${DR_REPO}.git"
          fi
          CUR_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Pushing $CUR_BRANCH → primary/$CUR_BRANCH AND dr/$CUR_BRANCH (hourly sync both, force-with-lease)"
          # Fetch both to ensure safe push
          git fetch primary "$CUR_BRANCH" 2>&1 | head -n 20 || echo "PRIMARY branch $CUR_BRANCH not yet exists — will create"
          git fetch dr "$CUR_BRANCH" 2>&1 | head -n 20 || echo "SECONDARY branch $CUR_BRANCH not yet exists — will create"
          # Push current branch to BOTH
          echo "→ Pushing to PRIMARY $PRIMARY_REPO"
          git push primary "HEAD:refs/heads/${CUR_BRANCH}" --force-with-lease 2>&1 | tail -n 20 || git push primary "HEAD:refs/heads/${CUR_BRANCH}" 2>&1 | tail -n 20 || echo "⚠️ PRIMARY push failed — check PAT repo scope (must have Vyomaraj1356) and repo exists/permissions"
          echo "→ Pushing to SECONDARY $DR_REPO"
          git push dr "HEAD:refs/heads/${CUR_BRANCH}" --force-with-lease 2>&1 | tail -n 20 || git push dr "HEAD:refs/heads/${CUR_BRANCH}" 2>&1 | tail -n 20 || echo "⚠️ SECONDARY push failed — check PAT repo scope and repo exists/permissions"
          # Also ensure main is always synced to BOTH for failover (hourly)
          if [ "$CUR_BRANCH" != "main" ]; then
            echo "Also syncing main to BOTH for failover (hourly)"
            git fetch origin main:refs/heads/main 2>&1 | head -n 5 || git fetch origin main 2>&1 | head -n 5 || true
            git push primary refs/heads/main:refs/heads/main --force-with-lease 2>&1 | tail -n 5 || git push primary refs/heads/main:refs/heads/main 2>&1 | tail -n 5 || echo "main sync to PRIMARY failed — will retry next hour"
            git push dr refs/heads/main:refs/heads/main --force-with-lease 2>&1 | tail -n 5 || git push dr refs/heads/main:refs/heads/main 2>&1 | tail -n 5 || echo "main sync to SECONDARY failed — will retry next hour"
          fi
          # Push all arena/* branches to BOTH for full parity (hourly sync both)
          echo "Syncing all arena/* branches to BOTH for full parity (hourly)"
          for br in $(git for-each-ref --format='%(refname:short)' refs/heads/arena/* 2>/dev/null | head -n 20); do
            echo "Pushing $br → primary/$br + dr/$br"
            git push primary "refs/heads/$br:refs/heads/$br" --force-with-lease 2>&1 | tail -n 5 || git push primary "refs/heads/$br:refs/heads/$br" 2>&1 | tail -n 5 || true
            git push dr "refs/heads/$br:refs/heads/$br" --force-with-lease 2>&1 | tail -n 5 || git push dr "refs/heads/$br:refs/heads/$br" 2>&1 | tail -n 5 || true
          done
          echo "✅ BOTH repos synced — PRIMARY (Vyomarajai) + SECONDARY (Vyomaraj-Agent) — hourly as requested, no data loss"

      - name: Pull from DR if Primary is behind (Bidirectional — DR → Primary failover)
        if: env.DR_PENDING == 'false'
        env:
          VYOMARAJ_PAT: ${{ secrets.VYOMARAJ_GH_PAT }}
        run: |
          set -e
          source $GITHUB_ENV || true
          DR_REPO="${DR_REPO:-Vyomaraj1356/Vyomaraj-Agent}"
          echo "🔄 Checking if DR is ahead of Primary (bidirectional sync for failover)"
          # Fetch DR main
          git fetch dr main:refs/remotes/dr/main 2>&1 | head -n 10 || echo "No dr/main to fetch"
          if git rev-parse --verify refs/remotes/dr/main >/dev/null 2>&1; then
            LOCAL_MAIN=$(git rev-parse refs/heads/main)
            DR_MAIN=$(git rev-parse refs/remotes/dr/main)
            if [ "$LOCAL_MAIN" != "$DR_MAIN" ]; then
              BEHIND=$(git rev-list --count refs/heads/main..refs/remotes/dr/main 2>/dev/null || echo 0)
              AHEAD=$(git rev-list --count refs/remotes/dr/main..refs/heads/main 2>/dev/null || echo 0)
              echo "Primary main $LOCAL_MAIN, DR main $DR_MAIN — DR ahead $BEHIND, Primary ahead $AHEAD"
              if [ "$BEHIND" -gt 0 ] && [ "$AHEAD" -eq 0 ]; then
                echo "⚠️ DR is ahead — Primary was down, DR took over — fast-forwarding Primary to DR (no data loss, DR had real-time updates)"
                git checkout main
                git merge --ff-only refs/remotes/dr/main || git reset --hard refs/remotes/dr/main
                git push origin main --force-with-lease 2>&1 | tail -n 10 || git push origin main 2>&1 | tail -n 10 || echo "Primary fast-forward push failed"
                echo "✅ Primary restored from DR — no business/data loss"
              elif [ "$BEHIND" -gt 0 ] && [ "$AHEAD" -gt 0 ]; then
                echo "⚠️ Both diverged — will keep Primary, but log DR commits for manual merge (no auto overwrite to avoid data loss)"
                git log --oneline refs/heads/main..refs/remotes/dr/main --max-count=10 2>&1 | head -n 20 || true
              else
                echo "Primary is ahead or equal — no pull needed"
              fi
            else
              echo "✅ Primary and DR main are identical — in sync"
            fi
          else
            echo "No DR main to compare — first sync will create it"
          fi

      - name: Heartbeat + PRIMARY/SECONDARY Health Check (every 30m, hourly sync both)
        run: |
          set -e
          source $GITHUB_ENV || true
          PRIMARY_REPO="${PRIMARY_REPO:-Vyomaraj1356/Vyomarajai}"
          DR_REPO="${DR_REPO:-deepakGoyal1356/Vyomaraj-Agent}"
          echo "💓 PRIMARY/SECONDARY Heartbeat + Health Check — $(date -u) — hourly sync both as requested"
          # Check PRIMARY health (Vyomarajai Public)
          if git ls-remote "https://github.com/${PRIMARY_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "✅ PRIMARY (Public) is UP — https://github.com/${PRIMARY_REPO}"
          else
            echo "🚨 PRIMARY DOWN — SECONDARY should be active — https://github.com/${DR_REPO} is serving"
          fi
          # Check SECONDARY health
          if git ls-remote origin HEAD >/dev/null 2>&1; then
            echo "✅ SECONDARY (origin) is UP — https://github.com/deepakGoyal1356/Vyomaraj-Agent"
          else
            echo "🚨 SECONDARY DOWN"
          fi
          # Check both with PAT
          if [ -n "${VYOMARAJ_PAT:-}" ]; then
            if git ls-remote primary HEAD >/dev/null 2>&1; then
              echo "✅ PRIMARY via PAT is UP — $PRIMARY_REPO"
            else
              echo "⚠️ PRIMARY not reachable via PAT — check PAT repo scope for Vyomaraj1356"
            fi
            if git ls-remote dr HEAD >/dev/null 2>&1; then
              echo "✅ SECONDARY via PAT is UP — $DR_REPO"
            else
              echo "⚠️ SECONDARY not reachable — check PAT or repo exists"
            fi
          fi
          # Heartbeat commit if 30m stale and scheduled (real-time keepalive)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST=$(git log -1 --format=%ct || echo 0)
            NOW=$(date +%s)
            AGE=$(( NOW - LAST ))
            echo "Last commit age: ${AGE}s (threshold 1800s for 30m)"
            if [ "$AGE" -gt 1800 ]; then
              echo "Heartbeat: 30m stale → keepalive"
              echo "$(date -u) DR heartbeat — $AGE seconds since last push — $(git rev-parse --short HEAD) — Primary↔DR sync" >> .vyomaraj-dr-heartbeat.log
              git add .vyomaraj-dr-heartbeat.log || true
              git commit -m "chore(dr): heartbeat 30m $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || echo "nothing to commit"
              git push origin HEAD 2>&1 | tail -n 10 || echo "heartbeat push to origin failed"
              if [ -n "${VYOMARAJ_PAT:-}" ]; then
                git push dr HEAD 2>&1 | tail -n 10 || echo "heartbeat push to DR failed"
              fi
            else
              echo "No heartbeat needed (<30m)"
            fi
          fi

      - name: Update DR Web URL + App Parity Marker (build accordingly)
        run: |
          echo "🌐 Web URL + App DR parity — $(date -u) — $(git rev-parse --short HEAD)"
          echo "Primary URL: https://deepakgoyal1356.github.io/Vyomaraj-Agent/"
          echo "DR URL: https://vyomaraj1356.github.io/${DR_REPO:-Vyomaraj-Ai-Studio}/ (fallback https://vyomaraj1356.github.io/Vyomarajai/)"
          echo "Custom: https://vyomaraj.network (if DNS set, primary; DR is Pages fallback)"
          echo "Web + App are DR-ready: web-v5 vite base + public/index.html DR fallback + app MainActivity DR fallback — see code"
          ls -lh public/index.html public/manifest.json web-v5/dist/index.html 2>&1 | head -n 20 || ls -lh public/index.html | head -n 5
          cat web-v5/vite.config.js 2>&1 | head -n 20 || true
          grep -n "DR\|vyomaraj.*failover\|deepak.*vyomaraj" public/index.html 2>&1 | head -n 20 || true
          grep -n "DR\|failover\|vyomaraj.*deepak" app/src/main/java/com/example/MainActivity.kt 2>&1 | head -n 20 || true

      - name: Summary — PRIMARY + SECONDARY Synced Hourly (per owner)
        run: |
          echo "### Vyomaraj Sync ✅ PRIMARY + SECONDARY — Hourly BOTH (per owner) — No Data Loss" >> $GITHUB_STEP_SUMMARY
          echo "- PRIMARY: Vyomaraj1356/Vyomarajai (Public, PRIMARY as per owner 2026-09-27) — https://github.com/Vyomaraj1356/Vyomarajai — always UP" >> $GITHUB_STEP_SUMMARY
          echo "- SECONDARY: deepakGoyal1356/Vyomaraj-Agent (Private, SECONDARY/DR) — https://github.com/deepakGoyal1356/Vyomaraj-Agent — always synced" >> $GITHUB_STEP_SUMMARY
          echo "- Sync: Hourly BOTH as requested — every 1h + 30m heartbeat + real-time on push — Primary ↔ Secondary bidirectional, no data loss" >> $GITHUB_STEP_SUMMARY
          echo "- Web URL: PRIMARY https://vyomaraj1356.github.io/Vyomarajai/ + SECONDARY https://deepakgoyal1356.github.io/Vyomaraj-Agent/ (+ vyomaraj.network) — client fails over in 3s if primary down" >> $GITHUB_STEP_SUMMARY
          echo "- App: Android MainActivity tries primary URL then secondary URL (3s timeout) — immediate activation, no business loss" >> $GITHUB_STEP_SUMMARY
          echo "- Data: Git history + DB (vyomaraj-db) + localStorage — replicated to BOTH, no loss — see render.yaml" >> $GITHUB_STEP_SUMMARY
          echo "- Manual DR now: workflow_dispatch or push to main/arena/* triggers real-time sync — no waiting" >> $GITHUB_STEP_SUMMARY
          echo "- If PAT missing: set VYOMARAJ_GH_PAT (classic, repo) in deepakGoyal1356/Vyomaraj-Agent → Settings → Secrets → Actions, then re-run" >> $GITHUB_STEP_SUMMARY
