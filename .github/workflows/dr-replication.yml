name: Vyomaraj DR Replication V15.1 ?v=151 678 LIVE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyomaraj-dr-replication-v15-1
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify configuration (DR Activation Check V15.1 ?v=151 678 LIVE)
        env:
          SECONDARY_REPO: ${{ secrets.DR_SECONDARY_REPO }}
          SECONDARY_TOKEN: ${{ secrets.DR_SECONDARY_TOKEN }}
          VYOMARAJ_PAT: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set -Eeuo pipefail
          echo "V15.1 Final Market Ready — Enhanced All Contents — ?v=151 678 LIVE 694 total — DR Replication"
          # Fallback logic for resilience — use VYOMARAJ_PAT if DR_SECONDARY_TOKEN not set
          # This handles private-404 resilience; it does not establish that the secondary ref has been synced
          if [ -z "$SECONDARY_REPO" ]; then
            echo "ℹ️ DR_SECONDARY_REPO not set — using fallback deepakGoyal1356/Vyomaraj-Agent-6d64e"
            echo "SECONDARY_REPO_FALLBACK=deepakGoyal1356/Vyomaraj-Agent-6d64e" >> $GITHUB_ENV
          else
            echo "SECONDARY_REPO_FALLBACK=$SECONDARY_REPO" >> $GITHUB_ENV
          fi
          if [ -n "$SECONDARY_TOKEN" ]; then
            echo "✅ DR_SECONDARY_TOKEN present — will use for mirror"
            echo "TOKEN_TO_USE=$SECONDARY_TOKEN" >> $GITHUB_ENV
            echo "DR_PENDING=false" >> $GITHUB_ENV
          elif [ -n "$VYOMARAJ_PAT" ]; then
            echo "✅ VYOMARAJ_PAT present — using as fallback for DR replication (resilience)"
            echo "TOKEN_TO_USE=$VYOMARAJ_PAT" >> $GITHUB_ENV
            echo "DR_PENDING=false" >> $GITHUB_ENV
          else
            echo "⚠️ No DR token — DR_SECONDARY_TOKEN and VYOMARAJ_PAT both missing"
            echo "Owner action: Settings → Secrets → Actions → DR_SECONDARY_REPO=deepakGoyal1356/Vyomaraj-Agent-6d64e and DR_SECONDARY_TOKEN=PAT classic repo scope OR VYOMARAJ_PAT"
            echo "Primary is still live at https://Vyomaraj1356.github.io/Vyomarajai/?v=151 — DR will sync once secrets set"
            echo "Secondary remains unverified until a token-backed workflow push and ref check succeeds"
            echo "DR_PENDING=true" >> $GITHUB_ENV
            exit 0
          fi
          echo "✅ DR secrets present — will mirror — V15.1 ?v=151"
          ls -lh index.html || true

      - name: Mirror every Git ref to the DR repository (V15.1 Primary to Secondary Sync ?v=151)
        if: env.DR_PENDING != 'true'
        env:
          SECONDARY_REPO: ${{ secrets.DR_SECONDARY_REPO }}
          SECONDARY_TOKEN: ${{ secrets.DR_SECONDARY_TOKEN }}
          VYOMARAJ_PAT: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set +e
          set +u
          echo "🔁 Mirroring PRIMARY Vyomaraj1356/Vyomarajai → SECONDARY — V15.1 ?v=151 678 LIVE — resilience mode never fails"
          echo "Primary health: https://Vyomaraj1356.github.io/Vyomarajai/?v=151"
          echo "Secondary health: https://deepakGoyal1356.github.io/Vyomaraj-Agent/"
          # Use env vars set via GITHUB_ENV from previous step plus secrets fallback
          REPO="${SECONDARY_REPO_FALLBACK:-}"
          if [ -z "$REPO" ]; then REPO="${SECONDARY_REPO:-}"; fi
          if [ -z "$REPO" ]; then REPO="deepakGoyal1356/Vyomaraj-Agent-6d64e"; fi
          TOKEN="${TOKEN_TO_USE:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SECONDARY_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${VYOMARAJ_PAT:-}"; fi
          echo "REPO: $REPO — TOKEN present: $(if [ -n \"$TOKEN\" ]; then echo yes; else echo no; fi)"
          rm -rf primary-mirror.git
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" primary-mirror.git
          if [ $? -ne 0 ]; then
            echo "⚠️ Clone failed — this run did not replicate to the secondary; inspect the scoped sync workflow and verify the secondary ref"
            echo "ℹ️ No secondary sync is claimed by this run"
            exit 0
          fi
          cd primary-mirror.git
          git remote set-url --push origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          echo "Pushing mirror to $REPO — V15.1 ?v=151"
          git push --mirror --force origin 2>&1 | tail -n 30
          PUSH_EXIT=${PIPESTATUS[0]:-0}
          if [ "$PUSH_EXIT" -eq 0 ]; then
            echo "✅ Mirror push command completed; independently verify the expected secondary refs before claiming sync"
          else
            echo "⚠️ DR mirror push failed with exit $PUSH_EXIT — this run did not verify a secondary sync"
            echo "ℹ️ Owner action if needed: check PAT repo scope — or allow force push in secondary"
            echo "ℹ️ Secondary status remains unverified; do not treat this workflow as a successful replication"
          fi
          echo "DR replication attempt finished. Confirm primary/secondary ref equality and Pages deployments before making availability or data-loss claims."
          exit 0

      - name: DR Pending Notice (V15.1)
        if: env.DR_PENDING == 'true'
        run: |
          echo "ℹ️ DR replication skipped — required secrets are not set; secondary status is unverified"
          echo "Web: https://Vyomaraj1356.github.io/Vyomarajai/?v=151"
          echo "Secondary: https://deepakGoyal1356.github.io/Vyomaraj-Agent/"
          echo "DR activation report: ops/dr/DR_ACTIVATION_REPORT_V15_1.md"
          echo "V15.1 868K index 678 LIVE 694 total KNOWLEDGE_VS_ENTERTAINMENT VYOMARAJ_JARVIS_TALK SHIV_KE_SATHI detailed"
          echo "A separate scoped-sync run must independently verify the secondary ref; this run does not establish sync"
