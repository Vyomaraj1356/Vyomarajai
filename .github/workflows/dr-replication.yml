name: Vyomaraj DR Replication Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyomaraj-dr-replication-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primary
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DR credential and repository
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set -Eeuo pipefail
          test -n "$DR_TOKEN"
          echo "::add-mask::$DR_TOKEN"
          DR_REPO="deepakGoyal1356/Vyomaraj-Agent-6d64e"
          CODE="$(curl -sS -o /tmp/dr.json -w "%{http_code}"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $DR_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$DR_REPO")"
          test "$CODE" = "200"
          echo "DR repository access: PASS"
          echo "DR repository: $DR_REPO"

      - name: Verify primary source state
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin "refs/heads/main" | awk 'NR==1 {print $1}')"
          test "$SHA" = "$REMOTE"
          echo "PRIMARY_SHA=$SHA"
          echo "PRIMARY ref verification: PASS"

      - name: Verify Primary tree against DR main with authenticated read-after-write
        env:
          DR_TOKEN: ${{ secrets.VYOMARAJ_PAT }}
        run: |
          set -Eeuo pipefail
          DR_REPO="deepakGoyal1356/Vyomaraj-Agent-6d64e"
          PRIMARY_REPO="Vyomaraj1356/Vyomarajai"
          API="https://api.github.com"
          PRIMARY_SHA="$(git rev-parse HEAD)"
          PRIMARY_TREE_SHA="$(curl -sS --fail-with-body -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $DR_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$API/repos/$PRIMARY_REPO/git/trees/$PRIMARY_SHA?recursive=1" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "PRIMARY_COMMIT_SHA=$PRIMARY_SHA"
          echo "PRIMARY_TREE_SHA=$PRIMARY_TREE_SHA"
          for attempt in $(seq 1 18); do
            DR_COMMIT_SHA="$(curl -sS --fail-with-body -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $DR_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$API/repos/$DR_REPO/git/refs/heads/main" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            DR_TREE_SHA="$(curl -sS --fail-with-body -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $DR_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$API/repos/$DR_REPO/git/commits/$DR_COMMIT_SHA" | python -c 'import json,sys; print(json.load(sys.stdin)["tree"]["sha"])')"
            echo "ATTEMPT=$attempt DR_COMMIT_SHA=$DR_COMMIT_SHA DR_TREE_SHA=$DR_TREE_SHA"
            if [ "$PRIMARY_TREE_SHA" = "$DR_TREE_SHA" ]; then
              echo "DR_VERIFIED_TREE_SHA=$DR_TREE_SHA"
              echo "DATA_MATCH=True"
              echo "READ_AFTER_WRITE_SHA=True"
              echo "DR_MAIN_VERIFICATION=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "DR_VERIFIED_TREE_SHA=$DR_TREE_SHA"
          echo "DATA_MATCH=False"
          echo "READ_AFTER_WRITE_SHA=False"
          echo "DR_MAIN_VERIFICATION=FAIL"
          exit 1

      - name: Report
        run: |
          echo "This workflow is verification-only."
          echo "Authenticated API replication is owned by vyomaraj-sync-both.yml."
          echo "No mirror --force, no blind overwrite, and no false-success fallback is used."
