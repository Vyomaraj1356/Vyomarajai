name: Vyomaraj DR Replication V15.1 ?v=151 678 LIVE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyomaraj-dr-replication-v15-1
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify configuration (DR Activation Check V15.1 ?v=151 678 LIVE)
        env:
          SECONDARY_REPO: ${{ secrets.DR_SECONDARY_REPO }}
          SECONDARY_TOKEN: ${{ secrets.DR_SECONDARY_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "V15.1 Final Market Ready — Enhanced All Contents — ?v=151 678 LIVE 694 total — DR Replication"
          if [ -z "$SECONDARY_REPO" ] || [ -z "$SECONDARY_TOKEN" ]; then
            echo "⚠️ DR secrets not set — DR_SECONDARY_REPO and DR_SECONDARY_TOKEN required"
            echo "Owner action: Settings → Secrets → Actions → DR_SECONDARY_REPO=deepakGoyal1356/Vyomaraj-Agent and DR_SECONDARY_TOKEN=PAT classic repo scope"
            echo "Primary is still live at https://Vyomaraj1356.github.io/Vyomarajai/?v=151 — DR will sync once secrets set"
            echo "DR_PENDING=true" >> $GITHUB_ENV
            exit 0
          fi
          echo "✅ DR secrets present — will mirror to $SECONDARY_REPO — V15.1 ?v=151"
          echo "DR_PENDING=false" >> $GITHUB_ENV
          echo "Checking index.html V15.1"
          ls -lh index.html || true

      - name: Mirror every Git ref to the DR repository (V15.1 Primary ↔ Secondary Sync ?v=151)
        if: env.DR_PENDING != 'true'
        env:
          SECONDARY_REPO: ${{ secrets.DR_SECONDARY_REPO }}
          SECONDARY_TOKEN: ${{ secrets.DR_SECONDARY_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "🔁 Mirroring PRIMARY Vyomaraj1356/Vyomarajai → SECONDARY $SECONDARY_REPO — V15.1 ?v=151 678 LIVE"
          echo "Primary health: https://Vyomaraj1356.github.io/Vyomarajai/?v=151"
          echo "Secondary health: https://deepakGoyal1356.github.io/Vyomaraj-Agent/"
          echo "Hourly BOTH + 30m heartbeat + real-time on push — 0.00 loss fraction-seconds"
          rm -rf primary-mirror.git
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" primary-mirror.git
          cd primary-mirror.git
          git remote set-url --push origin "https://x-access-token:${SECONDARY_TOKEN}@github.com/${SECONDARY_REPO}.git"
          git push --mirror --force origin
          echo "✅ DR Mirror Complete — Primary and Secondary in sync — V15.1 ?v=151 678 LIVE 694 total"
          echo "Web URL + App parity DR fallback — Bharat-Laxman Hanuman Quality Panch Shakti"

      - name: DR Pending Notice (V15.1)
        if: env.DR_PENDING == 'true'
        run: |
          echo "ℹ️ DR replication skipped — secrets not set — Primary live, Secondary will sync once owner sets secrets"
          echo "Web: https://Vyomaraj1356.github.io/Vyomarajai/?v=151"
          echo "DR activation report: ops/dr/DR_ACTIVATION_REPORT_V9.md"
          echo "V15.1 868K index 678 LIVE 694 total KNOWLEDGE_VS_ENTERTAINMENT VYOMARAJ_JARVIS_TALK"
